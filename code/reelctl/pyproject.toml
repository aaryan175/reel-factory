[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reelctl"
version = "0.1.0"
description = "Deterministic reference-reel reconstruction runtime"
requires-python = ">=3.9"
dependencies = [
  "fastapi>=0.115,<1",
  "fonttools>=4.50",
  "jsonschema>=4.18,<5",
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
  "Pillow>=10",
  "uvicorn>=0.30,<1",
  "yt-dlp>=2025.1.1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1"
]

[project.scripts]
reelctl = "reelctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
reelctl = ["data/*.json", "data/luts/*.cube", "schemas/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 140

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
